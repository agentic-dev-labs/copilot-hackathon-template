name: Check my website

# Day 4: copy this file to .github/workflows/check-my-website.yml. From then on GitHub checks every
# pull request and every push to main by itself (continuous integration). "Check the website"
# runs the build check and your tests. "UI check" opens your pages in a browser on a desktop and a
# phone. "Screenshots" shows those pictures in a comment on the pull request. Day 5 makes the first
# two required before a merge.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Every job may only read your files, unless it says otherwise.
permissions:
  contents: read

# A new commit on a pull request stops the check of the commit before it.
concurrency:
  group: check-my-website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check the website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Get my files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the workshop tools
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.7"

      - name: Prepare the test tools
        run: uv sync --locked --extra dev --extra web

      - name: Build check (the same check publishing runs)
        run: uv run python -m app.site --check

      - name: Run my tests
        run: |
          if ! ls checks/test_*.py > /dev/null 2>&1; then
            echo "::notice::No tests in checks/ yet. Write one on Day 3, then push again."
            exit 0
          fi
          uv run pytest checks

  ui:
    name: UI check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      results: ${{ steps.results.outputs.results }}
    steps:
      - name: Get my files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the workshop tools
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.7"

      - name: Prepare the website server
        run: uv sync --locked --extra dev --extra web

      # GitHub's Ubuntu machine already has everything a browser needs, so this downloads only the
      # browser itself, in seconds. (Adding --with-deps reinstalls those parts from Ubuntu's
      # servers, which took up to 14 minutes on 22 October 2026.)
      - name: Install a browser
        run: uv run --with playwright==1.64.0 playwright install chromium

      # Ubuntu 24.04 blocks what Chromium's sandbox needs. This runner is thrown away after the
      # job, so allow it here instead of ever switching the browser's sandbox off.
      - name: Let the browser keep its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Open my pages on a desktop and a phone
        run: |
          uv run uvicorn app.site:app --host 127.0.0.1 --port 8000 > website.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --silent --output /dev/null http://127.0.0.1:8000/ && break
            sleep 1
          done
          uv run --with playwright==1.64.0 python scripts/ui_check.py http://127.0.0.1:8000 --out ui-check

      # Single pictures, not zipped, so they open straight from the run's Artifacts list.
      - name: Keep the desktop screenshot
        if: ${{ always() && hashFiles('ui-check/home-desktop.png') != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: ui-check/home-desktop.png
          archive: false
          overwrite: true
          retention-days: 7

      - name: Keep the phone screenshot
        if: ${{ always() && hashFiles('ui-check/home-phone.png') != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: ui-check/home-phone.png
          archive: false
          overwrite: true
          retention-days: 7

      - name: Keep every screenshot, idea pages too
        if: ${{ always() && hashFiles('ui-check/*.png') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: all-screenshots
          path: ui-check/
          overwrite: true
          retention-days: 7

      - name: Pass the results on
        id: results
        if: ${{ always() && hashFiles('ui-check/*.png') != '' && hashFiles('ui-check/results.json') != '' }}
        run: echo "results=ready" >> "$GITHUB_OUTPUT"

  screenshots:
    name: Screenshots
    needs: ui
    # Pull requests from this repository only, also when the UI check found a problem.
    if: >-
      ${{ always() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.ui.outputs.results == 'ready' }}
    # A comment that cannot be posted never blocks a merge or the feature slot.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The only job that may write: it keeps the pictures on the ui-screenshots branch and comments
    # on the pull request. It runs main's helper, never the pull request's code.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get the helper from main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Get the screenshots
        uses: actions/download-artifact@v8
        with:
          name: all-screenshots
          path: ui-check

      - name: Show them on the pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/pr_screenshots.py ui-check --pull-request "$PULL_REQUEST" --commit "$HEAD_COMMIT"
