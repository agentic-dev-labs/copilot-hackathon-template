name: Copilot setup steps

on:
  workflow_dispatch:

jobs:
  # Copilot sessions have a 59-minute cap. Only steps, permissions, runs-on,
  # services, snapshot, and timeout-minutes are honoured for this job.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --extra web
