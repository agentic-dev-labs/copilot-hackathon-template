name: Deploy my app

on:
  workflow_dispatch:
    inputs:
      connect_dataverse:
        description: Configure the prepared Dataverse connection for Lab 05
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-nn-hackathon-2026-10
  ENVIRONMENT: cae-hackathon
  REGISTRY: acrnnhackathon2026

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.7"

      - name: Test before deployment
        run: |
          uv sync --locked --extra dev --extra web
          uv run ruff check .
          uv run pytest

      - name: Read config.json
        id: config
        run: |
          python app/config.py >> "$GITHUB_OUTPUT"
          python app/config.py

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build the image
        run: |
          az acr build \
            --registry "$REGISTRY" \
            --image "vendorapp/${{ steps.config.outputs.appName }}:${{ github.sha }}" \
            .

      - name: Deploy to Container Apps
        run: |
          APP="${{ steps.config.outputs.appName }}"
          IMAGE="$REGISTRY.azurecr.io/vendorapp/$APP:${{ github.sha }}"
          if az containerapp show -n "$APP" -g "$RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp update -n "$APP" -g "$RESOURCE_GROUP" --image "$IMAGE"
          else
            az containerapp create \
              -n "$APP" -g "$RESOURCE_GROUP" \
              --environment "$ENVIRONMENT" \
              --image "$IMAGE" \
              --target-port 8000 \
              --ingress external \
              --registry-server "$REGISTRY.azurecr.io" \
              --min-replicas 0 --max-replicas 1
          fi

      - name: Configure Dataverse for Lab 05
        if: ${{ inputs.connect_dataverse }}
        env:
          APP: ${{ steps.config.outputs.appName }}
          DATAVERSE_URL: ${{ vars.DATAVERSE_URL }}
          DATAVERSE_CLIENT_ID: ${{ vars.DATAVERSE_CLIENT_ID }}
          DATAVERSE_TENANT_ID: ${{ vars.DATAVERSE_TENANT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DATAVERSE_CLIENT_SECRET }}
        run: |
          : "${DATAVERSE_URL:?Set the DATAVERSE_URL Actions variable}"
          : "${DATAVERSE_CLIENT_ID:?Set the DATAVERSE_CLIENT_ID Actions variable}"
          : "${DATAVERSE_TENANT_ID:?Set the DATAVERSE_TENANT_ID Actions variable}"
          : "${DATAVERSE_CLIENT_SECRET:?Set the DATAVERSE_CLIENT_SECRET Actions secret}"
          az containerapp secret set -n "$APP" -g "$RESOURCE_GROUP" \
            --secrets "dataverse-client-secret=$DATAVERSE_CLIENT_SECRET" --output none
          az containerapp update -n "$APP" -g "$RESOURCE_GROUP" \
            --set-env-vars "DATAVERSE_URL=$DATAVERSE_URL" \
              "DATAVERSE_CLIENT_ID=$DATAVERSE_CLIENT_ID" \
              "DATAVERSE_TENANT_ID=$DATAVERSE_TENANT_ID" \
              "DATAVERSE_CLIENT_SECRET=secretref:dataverse-client-secret" --output none

      - name: Show the URL
        env:
          CONNECT_DATAVERSE: ${{ inputs.connect_dataverse }}
        run: |
          FQDN=$(az containerapp show -n "${{ steps.config.outputs.appName }}" \
            -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          test -n "$FQDN"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 \
            --max-time 30 "https://$FQDN/healthz"
          if [ "$CONNECT_DATAVERSE" = "true" ]; then
            PAGE=$(curl --fail --silent --show-error --max-time 60 "https://$FQDN/")
            if ! grep -q 'Source: Dataverse' <<< "$PAGE"; then
              echo "::error::The app is running but Dataverse did not connect. Check the identity and table permissions."
              exit 1
            fi
          fi
          echo "### Your app is live" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
