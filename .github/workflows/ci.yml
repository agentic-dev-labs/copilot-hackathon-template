name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.7"
      - run: uv sync --locked --extra dev --extra web
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Build Python wheel
        run: uv build --wheel
      - name: Build application image
        run: docker build --tag workshop-check .
